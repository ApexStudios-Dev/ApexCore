name: Test PR

on:
  workflow_run:
    workflows:
      - 'Build PR'
    types:
      - completed

jobs:
  upload-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout
        uses: ApexStudios-Dev/.github/actions/checkout@master

      - name: Download Artifact
        run: curl -O "https://maven.apexstudios.dev/private/dev/apexstudios/apexcore/${{ steps.checkout.outputs.version }}/apexcore-${{ steps.checkout.outputs.version }}.jar"

      - run: ls

name: Test PR

on:
  # TODO: Change to 'pull_request_target' before merging
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened

jobs:
  generate-version:
    name: Generate version
    uses: ApexStudios-Dev/.github/.github/workflows/_generate-version.yml@better-workflow # TODO: Change to master before merging

  publish-pr-artifact:
    name: Publish PR artifact
    if: success()
    needs: generate-version
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-pr-artifact.yml@better-workflow # TODO: Change to master before merging
    with:
      java-version: 21
      java-vendor: temurin
      mod-version: ${{ needs.generate-version.outputs.version }}

  check-local-changes:
    name: Check local changes
    if: success()
    needs: generate-version
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@better-workflow # TODO: Change to master before merging
    with:
      java-version: 21
      java-vendor: temurin
      mod-version: ${{ needs.generate-version.outputs.version }}

  test-production-server:
    name: Test Production Server
    if: success()
    runs-on: ubuntu-latest
    needs: [ generate-version, publish-pr-artifact, check-local-changes ]
    steps:
      - name: Install Mods
        run: |
          mkdir mods
          curl -O --output-dir mods https://maven.apexstudios.dev/private/dev/apexstudios/apexcore/${{ needs.generate-version.outputs.version }}/apexcore-${{ needs.generate-version.outputs.version }}.jar

      - name: Test Production Server
        uses: ApexStudios-Dev/.github/actions/test-production-server@better-workflow # TODO: Change to master before merging
        with:
          neoforge-version: 21.5.0-beta
          java-version: 21
          java-vendor: temurin

name: Test PR

on:
    pull_request:
        types:
            - synchronize
            - opened

jobs:
    generate-vars:
        name: Generate Vars
        uses: ApexStudios-Dev/.github/.github/workflows/_generate-vars.yml@master
        secrets: inherit

    build:
        name: Build
        needs: generate-vars
        if: success()
        uses: ApexStudios-Dev/.github/.github/workflows/_build.yml@master
        secrets: inherit
        with:
            java-version: 21
            java-vendor: temurin
            version: ${{ needs.generate-vars.outputs.version }}

    check-local-changes:
        name: Check local changes
        needs: generate-vars
        if: success()
        uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
        secrets: inherit
        with:
            java-version: 21
            java-vendor: temurin
            version: ${{ needs.generate-vars.outputs.version }}

    publish-maven:
        name: Publish Maven
        needs: [ generate-vars, build, check-local-changes ]
        runs-on: apexstudios
        if: success()
        steps:
            -   name: Checkout Repository
                uses: ApexStudios-Dev/.github/actions/checkout@master

            -   name: Setup Java
                uses: ApexStudios-Dev/.github/actions/setup-java@master
                with:
                    java-version: 21
                    java-vendor: temurin

            -   name: Setup Gradle
                uses: ApexStudios-Dev/.github/actions/setup-gradle@master

            -   name: Run with Gradle
                run: ./gradlew :publishReleasePublicationToApexStudios-PrivateRepository
                env:
                    VERSION: ${{ needs.generate-vars.outputs.version }}
                    MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
                    MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

            -   name: Publish PR
                if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
                uses: neoforged/action-pr-publishing/upload@v1

    test:
        name: Test Production
        runs-on: ubuntu-latest
        needs: [ generate-vars, publish-maven ]
        if: success()
        steps:
            -   name: Prepare Environment
                run: |
                    mkdir mods
                    wget -O "mods/apexcore-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/apexcore/${{ needs.generate-vars.outputs.version }}/apexcore-${{ needs.generate-vars.outputs.version }}.jar"

            -   name: Test Production Server
                uses: ApexStudios-Dev/.github/actions/test-production-server@master
                with:
                    java-version: 21
                    java-vendor: temurin
                    neoforge-version: 21.10.20-beta
                    # neoforge-maven: 'https://prmaven.neoforged.net/NeoForge/pr2699'

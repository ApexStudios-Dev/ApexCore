name: Publish PRs to GitHub Packages

on:
    workflow_run:
        workflows: [ 'Test PR' ]
        types: [ completed ]
    issue_comment:
        types: [ edited ]
    pull_request:
        types: [ opened ]
#    pull_request_target:
#        types: [ opened ]
    workflow_call:
        secrets:
            PR_PUBLISHING_GH_APP_ID:
                required: true
            PR_PUBLISHING_GH_APP_KEY:
                required: true

permissions:
    packages: write

jobs:
    publish-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Generate an Application repository access token
              id: gen_repo_token
              uses: kattecon/gh-app-access-token-gen@v1
              with:
                  app_id: ${{ secrets.PR_PUBLISHING_GH_APP_ID }}
                  private_key: ${{ secrets.PR_PUBLISHING_GH_APP_KEY }}
                  repository: ${{ github.repository }}

            - name: Publish PR
#              uses: neoforged/action-pr-publishing@v1
              uses: ApexModder/action-pr-publishing@main
              env:
                  GITHUB_TOKEN: ${{ steps.gen_repo_token.outputs.token }}
              with:
                  publishing-token: ${{ github.token }}
                  uploader-workflow-name: Build PRs
                  artifacts-base-path: dev/apexstudios/apexcore/
                  self-name: apexstudios-app[bot]
                  base-maven-url: https://maven.apexstudios.dev/private
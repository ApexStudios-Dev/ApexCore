name: Publish Dummy

on:
  pull_request:
    types:
      - synchronize
      - opened

permissions:
  contents: read

jobs:
  generate-vars:
    name: Generate Vars
    uses: ApexStudios-Dev/.github/.github/workflows/_generate-vars.yml@master
    secrets: inherit
    with:
      use-self-runner: false

  build:
    name: Build
    needs: generate-vars
    runs-on: ${{ needs.generate-vars.outputs.runner }}
    steps:
      - name: Checkout Repository
        uses: ApexStudios-Dev/.github/actions/checkout@master

      - name: Setup Java
        uses: ApexStudios-Dev/.github/actions/setup-java@master
        with:
          java-version: 25
          java-vendor: temurin

      - name: Setup Gradle
        uses: ApexStudios-Dev/.github/actions/setup-gradle@master
        with:
          use-gradle-cache: true

      - name: Build with Gradle
        run: ./gradlew :build
        env:
          VERSION: ${{ needs.generate-vars.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          path: 'build/libs/apexcore-${{ needs.generate-vars.outputs.version }}.jar'
          if-no-files-found: 'error'

  publish-curseforge:
    name: Publish to CurseForge
    runs-on: ubuntu-latest
    needs: [ generate-vars, build ]
    if: success()
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./

      - name: Publish to CurseForge
        uses: ApexStudios-Dev/.github/actions/publish-curseforge@master
        with:
          curseforge-id: '835372'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          display-name: 'ApexCore'
          artifact-id: 'apexcore'
          version: ${{ needs.generate-vars.outputs.version }}
          release-type: 'alpha'

  publish-modrinth:
    name: Publish to Modrinth
    runs-on: ubuntu-latest
    needs: [ generate-vars, build ]
    if: success()
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./

      - name: Publish to Modrinth
        uses: ApexStudios-Dev/.github/actions/publish-modrinth@master
        with:
          modrinth-id: 'EjjiYArZ'
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          display-name: 'ApexCore'
          artifact-id: 'apexcore'
          version: ${{ needs.generate-vars.outputs.version }}
          release-type: 'alpha'